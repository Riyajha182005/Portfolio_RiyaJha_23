<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131B"/>
      <stop offset="50%" stop-color="#261A28"/>
      <stop offset="100%" stop-color="#120E15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg7)"/>

  <g transform="translate(180, 80)">
    <rect width="440" height="250" rx="16" fill="#181419" stroke="#3A2E39" stroke-width="2"/>
    <rect width="440" height="40" rx="16" fill="#241B26"/>
    <text x="25" y="25" font-family="Inter, sans-serif" font-size="12" fill="#E0A96D" font-weight="bold">SSPL Lab &bull; Oscilloscope &amp; Sensor Calibration Rig</text>

    <!-- Lab Instrument Vector -->
    <rect x="40" y="65" width="220" height="150" rx="10" fill="#201824" stroke="#3A2E39"/>
    <rect x="55" y="80" width="190" height="85" rx="6" fill="#140E16" stroke="#3A2E39"/>
    <path d="M60 120 Q 100 85, 140 120 T 220 120" fill="none" stroke="#E0A96D" stroke-width="2"/>
    <text x="70" y="150" font-family="'Courier New', monospace" font-size="9" fill="#F43F5E">CH1: 24.8V &bull; 100MHz</text>

    <!-- Sensor Module -->
    <rect x="280" y="65" width="120" height="150" rx="10" fill="#201824" stroke="#3A2E39"/>
    <circle cx="340" cy="115" r="30" fill="#2E1B2E" stroke="#E0A96D" stroke-width="2"/>
    <circle cx="340" cy="115" r="8" fill="#F43F5E"/>
    <text x="340" y="165" font-family="Inter, sans-serif" font-size="9" fill="#EDE4E7" text-anchor="middle">Thermal Probe</text>
    <text x="340" y="180" font-family="Inter, sans-serif" font-size="8" fill="#A3929C" text-anchor="middle">Calibrated</text>
  </g>

  <text x="400" y="390" font-family="'Playfair Display', serif" font-size="24" fill="#FAF5F7" font-weight="bold" text-anchor="middle">SSPL Solid State Physics Lab Rig</text>
  <text x="400" y="420" font-family="Inter, sans-serif" font-size="13" fill="#E0A96D" font-weight="500" text-anchor="middle">Work Life &bull; Semiconductor Testing Bench &bull; Mar 2026</text>
</svg>
