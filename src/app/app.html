<div class="min-h-screen flex flex-col bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <!-- Navigation Header -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Brand / Logo -->
        <a routerLink="/home" class="flex items-center gap-3 group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform duration-200">
            P
          </div>
          <div class="flex flex-col">
            <span class="font-bold tracking-tight text-white group-hover:text-indigo-400 transition-colors">Portfolio</span>
            <span class="text-xs text-slate-400">Creative Developer</span>
          </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-1">
          <a
            routerLink="/home"
            routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all duration-150"
          >
            Home
          </a>
          <a
            routerLink="/experience"
            routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
            class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all duration-150"
          >
            Experience
          </a>
          <a
            routerLink="/gallery"
            routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
            class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all duration-150"
          >
            Gallery
          </a>
          <a
            routerLink="/projects"
            routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
            class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all duration-150"
          >
            Projects
          </a>
          <a
            routerLink="/contact"
            routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
            class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all duration-150"
          >
            Contact
          </a>
        </nav>

        <!-- CTA Button -->
        <div class="hidden md:flex items-center">
          <a
            routerLink="/contact"
            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 shadow-md shadow-indigo-500/20 transition-all duration-200"
          >
            Get In Touch
          </a>
        </div>

        <!-- Mobile Menu Hamburger Button -->
        <div class="md:hidden flex items-center">
          <button
            type="button"
            (click)="toggleMobileMenu()"
            class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none"
            aria-label="Toggle menu"
          >
            @if (!isMobileMenuOpen()) {
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            } @else {
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            }
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Dropdown Navigation -->
    @if (isMobileMenuOpen()) {
      <div class="md:hidden border-t border-slate-800 bg-slate-900/95 px-4 pt-3 pb-4 space-y-1">
        <a
          routerLink="/home"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="block px-3 py-2 rounded-md text-base text-slate-300 hover:text-white hover:bg-slate-800"
        >
          Home
        </a>
        <a
          routerLink="/experience"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
          class="block px-3 py-2 rounded-md text-base text-slate-300 hover:text-white hover:bg-slate-800"
        >
          Experience
        </a>
        <a
          routerLink="/gallery"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
          class="block px-3 py-2 rounded-md text-base text-slate-300 hover:text-white hover:bg-slate-800"
        >
          Gallery
        </a>
        <a
          routerLink="/projects"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
          class="block px-3 py-2 rounded-md text-base text-slate-300 hover:text-white hover:bg-slate-800"
        >
          Projects
        </a>
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-indigo-600/20 text-indigo-400 font-semibold"
          class="block px-3 py-2 rounded-md text-base text-slate-300 hover:text-white hover:bg-slate-800"
        >
          Contact
        </a>
      </div>
    }
  </header>

  <!-- Main Content Routed Outlet -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-sm text-slate-400">Available for new opportunities</span>
      </div>
      <p class="text-sm text-slate-500">
        &copy; 2026 Portfolio. Built with Angular &amp; Tailwind CSS.
      </p>
      <div class="flex items-center gap-4 text-sm text-slate-400">
        <a routerLink="/home" class="hover:text-indigo-400 transition-colors">Home</a>
        <a routerLink="/projects" class="hover:text-indigo-400 transition-colors">Projects</a>
        <a routerLink="/contact" class="hover:text-indigo-400 transition-colors">Contact</a>
      </div>
    </div>
  </footer>
</div>
