<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281D26" />
      <stop offset="100%" stop-color="#120E13" />
    </linearGradient>

    <!-- Border luxury gold-to-rose gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Monogram text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF5F7" />
      <stop offset="100%" stop-color="#E0A96D" />
    </linearGradient>

    <!-- Soft glow drop shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Luxury Card Frame -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Monogram RJ in serif typography -->
  <text
    x="32"
    y="42"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#textGrad)"
    text-anchor="middle"
    filter="url(#softGlow)"
  >RJ</text>

  <!-- Accent Rose-Gold Spark Dot -->
  <circle cx="47.5" cy="18.5" r="3" fill="#F43F5E" />
  <circle cx="47.5" cy="18.5" r="1.3" fill="#FFFFFF" />
</svg>
