<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B141E"/>
      <stop offset="50%" stop-color="#2B1E2D"/>
      <stop offset="100%" stop-color="#151017"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="400" cy="200" r="220" fill="url(#aiGlow)"/>

  <!-- LLM Neural Node Visual -->
  <g transform="translate(180, 80)">
    <rect width="440" height="250" rx="16" fill="#181419" stroke="#3A2E39" stroke-width="2"/>
    <rect width="440" height="40" rx="16" fill="#241B26"/>
    <text x="25" y="25" font-family="Inter, sans-serif" font-size="12" fill="#E0A96D" font-weight="bold">IGDTUW &bull; Generative AI &amp; LLM Automation</text>

    <!-- Neural Token Pipeline -->
    <g transform="translate(40, 70)">
      <!-- Input Token -->
      <rect x="0" y="25" width="80" height="50" rx="8" fill="#251A27" stroke="#E0A96D"/>
      <text x="40" y="47" font-family="Inter, sans-serif" font-size="10" fill="#FAF5F7" text-anchor="middle">Prompt</text>
      <text x="40" y="62" font-family="Inter, sans-serif" font-size="8" fill="#E0A96D" text-anchor="middle">Few-Shot</text>

      <!-- Arrow -->
      <path d="M90 50 H120" stroke="#E0A96D" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- LLM Transformer Core -->
      <rect x="130" y="10" width="100" height="80" rx="12" fill="#321D32" stroke="#F43F5E" stroke-width="2"/>
      <text x="180" y="45" font-family="Inter, sans-serif" font-size="11" fill="#FAF5F7" font-weight="bold" text-anchor="middle">LLM Engine</text>
      <text x="180" y="63" font-family="Inter, sans-serif" font-size="8" fill="#F43F5E" text-anchor="middle">Self-Attention</text>

      <!-- Arrow -->
      <path d="M240 50 H270" stroke="#F43F5E" stroke-width="2"/>

      <!-- Output Synthesis -->
      <rect x="280" y="25" width="80" height="50" rx="8" fill="#251A27" stroke="#E0A96D"/>
      <text x="320" y="47" font-family="Inter, sans-serif" font-size="10" fill="#FAF5F7" text-anchor="middle">Synthesis</text>
      <text x="320" y="62" font-family="Inter, sans-serif" font-size="8" fill="#E0A96D" text-anchor="middle">Automated</text>
    </g>

    <rect x="40" y="180" width="360" height="40" rx="8" fill="#201723" stroke="#3A2E39"/>
    <text x="55" y="205" font-family="Inter, sans-serif" font-size="11" fill="#EDE4E7">&bull; Optimized prompt token efficiency by 42% across test suites</text>
  </g>

  <text x="400" y="390" font-family="'Playfair Display', serif" font-size="24" fill="#FAF5F7" font-weight="bold" text-anchor="middle">IGDTUW Generative AI Lab</text>
  <text x="400" y="420" font-family="Inter, sans-serif" font-size="13" fill="#E0A96D" font-weight="500" text-anchor="middle">Gen AI Intern &bull; Delhi, India &bull; Jun 2025 – Jul 2025</text>
</svg>
